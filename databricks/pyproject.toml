[project]
name = "uc-13-ale-databricks"
version = "0.1.0"
description = "UC13 agentic ingestion pipeline for Rallyday Partners - Databricks modules"
requires-python = ">=3.11"
dependencies = [
    "msal>=1.28.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "jsonschema>=4.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    # Agent runtime — imported by agents/shared/agent_base.py (ResponsesAgent)
    # and the eval harness models. Required for the pytest suite to import the
    # agent tree; keep in sync with requirements.txt (cluster runtime).
    "pydantic>=2.0.0",
    "mlflow>=3.1",
]

[tool.uv]
dev-dependencies = [
    "pymupdf>=1.28.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "weasyprint>=69.0",
]
