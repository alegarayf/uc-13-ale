# a substitute for S2 claim-failure backlog items below.
schema_version: 1
items:
  - id: PB-exec_summary-retrieval-scope-gap
    company: elder_care
    surface: exec_summary
    kind: retrieval_scope_gap
    severity: high
    summary: >-
      Spot-check retrieval only queries VDR chunk RAG; exec_summary claims trace to
      analysis.diligence_report and sibling workstream tables — 28/30 drafted-unsupported
      claims were retrieval_scope_gap, not corpus or generator defects. T12 wired dual-source
      in calibration.py only (CHK-26a 0.857); spot_check.py still chunk-only.
    evidence_refs:
      - eval/content/spot-check/exec_summary_elder_care_2026-08-12.failure_modes.md
      - eval/content/spot-check/exec_summary_elder_care_2026-08-12.m3_backlog.md
      - eval/eval_program_playbook.md
      - eval/content/calibration.py
      - eval/content/spot_check.py
    fix_lane: product
    closes_when: >-
      exec_summary spot-check evidence fetch queries analysis.diligence_report aggregation
      fields and per-workstream tables alongside chunk RAG (parity with calibration.py
      dual-source); re-run shows drafted-unsupported rate drops materially vs 2026-08-12 baseline.
    registry_ref: OI-eval-content-exec-summary-judge-rung-build

