- id: GAP-M5-1-onboarding-driver-race-condition
  title: 'Onboarding cluster driver-path race condition — concurrent bootstrap/harness-baseline
    lanes silently contaminated each other via a shared, non-company-scoped workspace
    driver path. Fixed 2026-08-19 by scoping driver filenames per company slug.'
  source_refs:
  - .dev/wave1-rebaseline-2026-08-19/CRITICAL-race-condition-finding.md
  - .dev/wave1-rebaseline-2026-08-19/manifest.md
  - .dev/wave1.5-remediation-2026-08-19/manifest.md
  source_id: null
  disposition: resolved
  stage: S3
  status: n/a
  trigger: Wave 1 measurement-reset session (2026-08-19) — 4 concurrent onboarding lanes
    triggered silent cross-company contamination in _upload_driver()
  rationale: 'Root cause: eval/program/onboarding_cluster_submit.py _upload_driver()
    wrote bootstrap/harness driver scripts to a fixed path (/Users/{user}/onboarding_bootstrap_runner.py,
    /Users/{user}/onboarding_harness_runner.py) with no company scoping. Concurrent
    lanes overwrote each other before serverless cold-start read the file, causing
    jobs to silently execute against the wrong company while run_name/DATABRICKS_RUN_ID
    still displayed the intended company. Confirmed via direct log inspection: Round
    2 bootstrap (2026-08-19 14:27-14:37) showed 3 of 4 concurrent lanes (elder_care,
    clearsulting, gkf) executing as spg. Fix: driver filenames now scoped by
    _slug(company), e.g. onboarding_bootstrap_runner_{slug}.py / onboarding_harness_runner_{slug}.py
    (two call sites in run_bootstrap()/run_harness_baseline()). Verified fix in
    Wave 1.5: GKF and Clearsulting bootstrap lanes ran concurrently post-fix with
    no contamination (GKF harness verified company_name=GKF; Clearsulting bootstrap
    company-scoped path confirmed on both attempts).'
  tshirt: null
  evidence_refs:
