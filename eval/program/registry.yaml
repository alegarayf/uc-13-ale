- id: GAP-M5-3-onboarding-export-gold-encoding-fix
  title: 'Onboarding export-gold encoding-safe download — local gold YAML pulled from workspace
    via binary write_bytes(), eliminating Windows cp1252 0x97 corruption of U+2014 em dashes
    in bootstrap notes. Fixed 2026-08-19.'
  source_refs:
  - .dev/wave1.5-remediation-2026-08-19/0x97-byte-investigation.md
  - .dev/wave1.6-remediation-2026-08-19/phase1-validation.md
  - .dev/wave1.6-remediation-2026-08-19/clearsulting.md
  source_id: null
  disposition: resolved
  stage: S3
  status: n/a
  trigger: Wave 1.5 harness HALT — UnicodeDecodeError on byte 0x97 in elder_care.yaml and
    clearsulting.yaml; root-caused as text-mode local write without encoding=utf-8 pin
  rationale: 'Root cause: no encoding-safe local download path existed in onboarding_cluster_submit.py
    prior to Wave 1.6. Ad-hoc per-lane workspace→laptop pulls (documented operationally for SPG in
    Wave 1.5) used text-mode writes that mis-encoded U+2014 em dashes from KPI citation claim labels
    as raw byte 0x97 (Windows-1252). Bootstrap writer (write_gold_labels) was already correct
    (encoding=utf-8); ingestion.chunks confirmed clean (no char(151)). Fix: added export_gold()
    subcommand using workspace.export() + base64 decode + Path.write_bytes() with UTF-8 validation
    before and after write. Verified on Elder Care (0 raw 0x97, 13 UTF-8 em dashes, harness
    baseline_2fa3a9056bd0 complete) and Clearsulting (0 raw 0x97, 18 UTF-8 em dashes, harness
    baseline_488f70f13570 complete). GKF export also clean (0×0x97 per Lane B). Pair with
    harness-baseline --no-sync to avoid stale local gold overwriting workspace copy.'
  tshirt: null
  evidence_refs:
