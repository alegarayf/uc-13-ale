    title: Catalog names — eval / obvs / prod
    status: awaiting_confirm
    waiting_on: team
    topic: catalogs
    parked_at: '2026-08-31'
    decision_needed: >-
      Confirm or reject a three-name catalog map (eval / obvs / prod) versus today's
      uc13_ale / {catalog}.ops-inside-each / uc13, plus the uc13_preview CIM sandbox.
    current_state: >-
      Standing convention is three existing Unity Catalog names, not interchangeable:
      uc13 (production), uc13_ale (eval / harness), uc13_preview (CIM preview sandbox).
      Observability is the ops schema inside each catalog (apply_ops_ddl.sql), not a
      fourth catalog. doc_id hashes the catalog name; data does not migrate. Production
      uc13 is still not M0–M4 ready (2026-08-10; no later retract). MERGE_SCOUT
      "catalog split" was never written to a decision log.
    options:
      - id: keep_today
        label: Keep uc13 / uc13_ale / uc13_preview; ops stays per-catalog
      - id: rename_three
