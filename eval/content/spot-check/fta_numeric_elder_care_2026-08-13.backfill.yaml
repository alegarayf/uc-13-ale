- claim_id: fta.claim.220
  verdict: supported
  rationale: 'one_to_many claim; disambiguation by (source_doc, source_location, field_name,
    magnitude) yielded 2 candidates (need exactly 1) -> unresolvable per locked rule.
    OPERATOR OVERRIDE (2026-08-13): reclassified unsupported->supported. The magnitude
    is genuinely present in the live financial_trends JSON under this (source_doc,
    field) pair; only the specific array index is ambiguous because the source JSON
    itself contains duplicate records (see m3_backlog.md #1). Verdict changed on the
    basis that the underlying fact is true even though a unique JSON path cannot be
    cited; confidence stays LOW and needs_human stays true pending the path-uniqueness
    fix. OPERATOR REVIEWED (2026-08-13): needs_human -> false, confidence unchanged
    (stays LOW). Independent follow-up validation (read-only, live Databricks) confirmed
    the root cause precisely: revenue_by_segment_json contains two byte-identical
    duplicated blocks -- Westchester [5]-[9] duplicated at [20]-[24], and Long Island
    [10]-[14] duplicated at [31]-[35] -- and every indexed claim''s value matches
    at its stated array index (20/20 checked). The magnitude is confirmed genuinely
    present; the ambiguity is fully diagnosed as a source-JSON duplicate-row artifact
    (see m3_backlog.md #1), not an extraction or reasoning error. Per the S2 write
    path (write_spot_check_results / spot_check.py), only verdict+rationale are ingested
    -- needs_human/confidence are session metadata, not ingest gates. Stays LOW (not
    promoted) because the specific array index is still genuinely undecidable between
    two identical candidates.'
