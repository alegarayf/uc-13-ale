executive_summary: 'Fourteen contracts were extracted across asset purchase agreements, lease agreements, BAAs, employment/non-compete
  templates, and engagement letters. The most significant change-of-control exposure exists in the Manhattan lease (50% ownership
  threshold triggers consent requirement) and the Westchester lease (majority stock transfer deemed an assignment), both requiring
  prior written landlord consent; the Long Island lease contains an anti-assignment clause but no explicit CoC ownership threshold
  was stated. One open litigation matter was identified: Elder Care Homecare, Inc. engaged outside collection counsel in April
  2025 for collection of patient receivables, with counterclaims noted as handled by insurance or separate counsel.'
