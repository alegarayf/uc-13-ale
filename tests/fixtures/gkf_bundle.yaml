executive:
  in_one_line: Five-school Goddard franchisee in the DMV with $22.3M revenue, 29% Adj. EBITDA margins, and near-pure recurring
    tuition — but a heavily owner-adjusted EBITDA bridge, occupancy softness at two locations, and a franchisor change-of-control
    consent requirement that must be resolved before close.
  preliminary_view:
    strengths:
    - 'Revenue quality is exceptionally high: ~98% recurring tuition fees, $2,422 average monthly tuition per student, ~3-year
      average student tenure, and $2.0M in deferred (prepaid) tuition on the balance sheet provide strong cash flow visibility.'
    - Gross margins of 52–53% and Adj. EBITDA of $6.4M (29% margin) in 2024A are attractive for a multi-site childcare operator;
      the elimination of $7.3M in related-party management fees from 2026P onward materially normalizes the earnings base.
    - The Goddard brand affiliation in high-income DMV submarkets (Bethesda, Tysons Corner, Rockville) supports premium tuition
      pricing and family retention; a 10.3% revenue CAGR over five years demonstrates durable demand.
    - Leadership team carries deep industry tenure — CEO Mike Pesi (25+ years, on-site since 2015), DMO Laura Dinder (10+
      years), and CSO Ross Flax (35+ years) — providing operational continuity through a transition.
    - Committed greenfield expansion into Detroit and Salt Lake City targets ~$57M in incremental revenue by 2030 across 19
      new schools, offering a visible platform growth story beyond the existing five-site base.
    concerns:
    - All ten QofE addbacks are classified Tier 4 (no supporting document referenced in the passthrough schedule); the largest
      single item — $5.7M in management fees — requires independent verification that go-forward owner compensation is fully
      and correctly offset before any EBITDA multiple can be applied with confidence.
    - Diligence-adjusted EBITDA of $6.66M (TTM25) includes a ~$738K pro forma uplift for the Bethesda expansion that depends
      on 36 incremental enrollments not yet achieved; stripping this adjustment reduces run-rate EBITDA meaningfully.
    - Overall portfolio occupancy declined from 903 individuals in FY23 to 872 in TTM25; Smart Kids fell from 92% to 83% occupancy
      and Tysons Kids showed intra-period dips to 74%, signaling location-level demand risk that is not reflected in the consolidated
      headline.
    - GFL (Goddard Franchise Limited) change-of-control consent is required per the Goddard FDD 2025 — a deal-critical condition
      that must be obtained pre-close and whose terms (including any transfer fees or re-approval conditions) are not yet
      confirmed.
    - The company operates on a modified cash basis with no formal accrual process; prepaid tuition balances are updated only
      annually or semi-annually, and historical prepaid tuition data could not be obtained — creating unquantified revenue
      recognition exposure.
    - 'Key legal gaps remain open: founder/key-employee agreements, vendor pricing and cancellation terms, platform/channel
      dependencies, and litigation exposure were all unextractable from retrieved documents, leaving material contract risk
      unassessed.'
    closing: 'The single most consequential open question is whether the $5.7M management-fee addback — and the go-forward
      owner compensation offset — will survive an independent QofE: the answer determines whether the reported 29% EBITDA
      margin is real or a presentation artifact, and therefore whether the platform growth story is being offered at a credible
      entry price.'
  business_snapshot_narrative: Project Ajax is a five-location Goddard School franchisee concentrated in affluent DMV submarkets
    (Bethesda, Rockville, Tysons Corner, Ellicott City, Clarksburg), generating $22.3M in 2024A revenue at a 10.3% five-year
    CAGR almost entirely from recurring monthly tuition fees (~98% of revenue) averaging $2,422 per student. Gross margins
    of 52–53% and a reported Adj. EBITDA of $6.4M (29%) are compelling for the sector, but the earnings base is heavily shaped
    by the elimination of $7.3M in related-party management fees — making the true normalized margin the central underwriting
    question. The company is positioned as a premium early-childhood platform with a committed greenfield expansion into two
    new markets (Detroit, Salt Lake City) targeting ~$57M in new revenue by 2030, which warrants scrutiny of unit-economics
    replicability outside the DMV. The full report examines whether the EBITDA bridge holds under independent QofE, where
    occupancy is softening, and what the Goddard franchisor consent process means for deal certainty.
  confidence_rationale: 'KPI confidence is rated low because enrollment by location, tuition rate by program type, staff-to-child
    ratios, employee turnover, waitlist data, licensing inspection history, franchise agreement terms, lease schedules, and
    family re-enrollment rates were all absent from retrieved documents — the KPI dashboard is effectively a gap register
    rather than a populated scorecard. Forecast confidence is similarly low: no budget-vs.-actual data was found, making it
    impossible to assess whether management''s 2025B or greenfield projections are grounded in historical execution. The modified
    cash-basis accounting policy, with prepaid tuition balances updated only annually or semi-annually and no historical prepaid
    data obtainable, introduces an unquantified revenue recognition exposure that caps QofE confidence at medium. Legal confidence
    is medium because founder/key-employee agreements, vendor pricing and cancellation terms, platform dependencies, and litigation
    exposure were all unextractable — the GFL change-of-control consent is confirmed as deal-critical, but the full contract
    risk perimeter remains open.'
  preliminary_digest: Revenue is nearly pure recurring tuition with a five-year CAGR of 10.3% and gross margins consistently
    in the 52–53% range, making the top-line quality among the strongest attributes of this asset. [Revenue Quality] Reported
    Adj. EBITDA of $6.4M (2024A) and $7.6M (2025B) are materially dependent on a $5.7M management-fee addback and a $738K
    Bethesda expansion pro forma that has not yet been earned; diligence-adjusted EBITDA of $6.66M (TTM25) is the more defensible
    baseline. [Quality of Earnings] Portfolio occupancy declined from 903 to 872 individuals between FY23 and TTM25, with
    Smart Kids dropping to 83% and Tysons Kids experiencing intra-period dips to 74% — two locations that require site-level
    P&L scrutiny. [KPI Dashboard] The Goddard FDD 2025 requires GFL change-of-control consent, and founder/key-employee agreements,
    vendor terms, and litigation exposure remain unextracted — leaving the legal risk perimeter materially open. [Legal Snapshot]
    Greenfield expansion into Detroit and Salt Lake City (19 schools, ~$57M revenue target by 2030) is the primary value-creation
    lever, but no budget-vs.-actual track record or unit-economics support for new markets was available in the data room.
    [Financial Strip] Confidence is high on financial trends but low on KPIs and forecast support, and the modified cash-basis
    accounting policy with unquantified prepaid tuition exposure adds a further layer of earnings quality uncertainty. [Confidence
    by Area]
  thesis_bullets:
  - 'Premium DMV franchise platform: five Goddard-branded schools in high-income submarkets with ~98% recurring tuition revenue,
    52–53% gross margins, and a demonstrated 10.3% five-year revenue CAGR — a rare combination of revenue quality and margin
    profile in fragmented childcare M&A.'
  - 'Earnings normalization opportunity: elimination of $7.3M in related-party management fees from 2026P onward converts
    a heavily owner-managed P&L into an institutional earnings base, with Adj. EBITDA projected to reach $7.9M (2026P) — contingent
    on independent QofE validation of the addback.'
  - 'Bethesda capacity expansion as near-term catalyst: licensed capacity increase at the highest-occupancy location (L3M
    average 97%) targets steady-state by summer 2026, with ~$1.3M incremental revenue and ~$738K EBITDA already embedded in
    the TTM25 pro forma.'
  - 'Greenfield platform growth story: committed expansion into Detroit and Salt Lake City (19 schools, ~3,040 students, ~$57M
    revenue by 2030) offers a replicable franchise rollout thesis — though unit economics outside the DMV are unvalidated
    and represent the primary execution risk.'
  - 'Experienced owner-operator team with transition structure: CEO Mike Pesi (on-site since 2015), DMO Laura Dinder, and
    CSO Ross Flax average ~15 years of industry tenure; the 2025 formalization of the executive structure is designed to support
    institutional ownership, though key-employee agreements have not been confirmed.'
  - 'Franchisor relationship as both moat and constraint: Goddard brand affiliation supports premium pricing and family trust,
    but GFL change-of-control consent and franchise transfer provisions are deal-gating conditions that will shape transaction
    structure and timeline.'
  key_watchouts:
  - 'Occupancy softness at two locations: Smart Kids (Clarksburg) declined from 92% to 83% occupancy and Tysons Kids showed
    intra-period dips to 74% between FY23 and TTM25 — site-level P&L and enrollment trend data are needed to determine whether
    these reflect structural demand weakness or temporary disruption.'
  - 'Enrollment replicability in new markets: the greenfield expansion thesis (Detroit, Salt Lake City) assumes DMV-level
    tuition pricing and fill rates in markets with different competitive dynamics and income demographics; no unit-economics
    benchmarks for these markets are present in the data room.'
  - 'Teacher and staff retention risk: with salaries and wages at $8.8M (the largest COGS item) across ~217–253 employees
    and a contractor workforce at Clarksburg, employee turnover data by location and role are entirely absent — a critical
    gap for a labor-intensive, ratio-regulated business.'
  - 'Referral and enrollment concentration: no family-level retention or re-enrollment rate data was provided; the ~3-year
    average student tenure and $177K LTV figures are management representations without independent verification, and churn
    at any single high-occupancy location would disproportionately impact revenue.'
  - 'Franchisor change-of-control consent: GFL consent is required under the Goddard FDD 2025 and is a deal-gating condition;
    transfer fees, re-approval requirements, and any franchisor right of first refusal have not been confirmed and could affect
    deal structure, timeline, or economics.'
  - 'Organic vs. acquisition growth mix: all five current locations are organic or legacy franchise sites; the greenfield
    expansion plan has no acquisition track record to benchmark against, and the absence of budget-vs.-actual data makes it
    impossible to assess whether management has demonstrated the execution discipline required for a 19-school build-out.'
company_framing:
  overview_bullets:
  - Ajax (Project Ajax) is a Goddard School franchisee operating 5 early childhood education centers in the DMV area (Ellicott
    City, Rockville, Bethesda, Tysons Corner, Clarksburg), generating $22.3M in revenue in 2024A with a 10.3% revenue CAGR
    over the prior 5 years. Revenue is almost entirely recurring tuition fees (~98% of revenue) at an average monthly tuition
    of $2,422 per student, with gross margins of 52–53% and Adj. EBITDA of $6.4M (29% margin) in 2024A growing to $7.6M (30%)
    in 2025B. The company is led by CEO Mike Pesi (25+ years industry experience, on-site owner since 2015, transitioned to
    CEO in 2025), Designated Market Operator Laura Dinder (10+ years), and Chief Strategy Officer Ross Flax (35+ years), with
    an average ~15 years of industry experience across the team; no ownership table was provided in the retrieved documents.
    The workforce totals approximately 217–253 employees across 5 school locations, all onsite in the DMV, with a contractor
    workforce at Clarksburg; salaries and wages represent the largest COGS item at $8.8M in 2024A. Customer stickiness is
    supported by an average ~3-year student tenure and $177K total potential LTV per student, with $2.0M in deferred revenue
    (prepaid tuition) on the balance sheet. Key recent changes include the Bethesda location expansion (targeting steady-state
    by summer 2026), committed greenfield expansion into Detroit and Salt Lake City targeting ~$57M in new revenue by 2030,
    and the elimination of $7.3M in management fees beginning in 2026P which significantly normalizes reported EBITDA.
  - Tuition Fees - Preschool / Core Childcare (Tuition Fees - Other)
  - Registration Fees
  - Summer Camp
