executive:
  in_one_line: Clearsulting is a ~$63M OCFO digital transformation consultancy with a 20% EBITDA margin, a credible land-and-expand
    model, and a heavily contested addback stack that makes the stated earnings base the central diligence question.
  preliminary_view:
    strengths:
    - 'Diversified, no-client-over-20% revenue base with demonstrated land-and-expand traction: customer count grew from 223
      to ~394 and project count from 296 to ~587 over 2023–TTM25 per the CIM, supporting the $300M+ lifetime sales claim.'
    - Practice-level gross margins are differentiated and defensible — Treasury at ~63% and Financial Close at ~58% anchor
      the blended 43.6% TTM25 adjusted gross margin and suggest pricing power in the firm's core competencies.
    - Deep second-layer leadership (14 named practice leads and regional heads averaging ~7 years tenure) reduces founder-concentration
      risk and provides a platform for post-close continuity.
    - 'Structural cost arbitrage is nascent but directionally positive: the Poland-based AMS team and ~9% offshore delivery
      mix (30 of 334 FTEs in ''Other/Remote Delivery'' per the CIM headcount table) create a margin lever that is not yet
      fully reflected in TTM25 results.'
    - New recurring-revenue vector (AMS, fixed-fee/hybrid now 39% of YTD May 2025 revenue vs. 26% in 2024) and two greenfield
      practices (SAP S/4HANA, HighRadius OTC) provide identifiable growth optionality beyond the core T&M book.
    concerns:
    - All 12 EBITDA addbacks are classified Tier 4 (no VDR document support), and five individually exceed 5% of reported
      EBITDA — the $4,715K total addback pool represents 59.7% of reported TTM25 EBITDA of $7,899K, making the $12,614K diligence-adjusted
      figure highly vulnerable to buyer QofE challenge.
    - Several addbacks recur across all three measurement periods (restructuring, new venture losses, go-forward bonus adjustment),
      suggesting these are structural costs embedded in the run-rate rather than genuinely one-time items.
    - Revenue growth of ~3.8% (2024A vs. TTM25 per the financial diligence report) is below the pace implied by the CIM's
      customer and project count expansion, raising questions about average deal size compression or episodic large-client
      roll-off (Amazon, OCI N.V. project completions visible in the Revenue Masterfile).
    - A hindsight revenue recognition restatement (Adj-07) affects 24.6% of TTM25 revenue, and multiple unexplained negative
      revenue entries appear across clients in the Revenue Masterfile — both patterns require reconciliation before the top-line
      can be taken at face value.
    - 'The entire legal layer is unassessed: no customer MSAs/SOWs, employment agreements, founder agreements, change-of-control
      provisions, or litigation schedule were available in the VDR, leaving contract portability and key-person retention
      entirely unresolved.'
    - Core consulting KPIs — blended utilization rate, attrition by level, backlog/pipeline coverage, revenue per FTE, and
      top-10 client concentration — are absent from the data room, making it impossible to independently validate the operating
      model or forecast credibility.
    closing: 'The single most consequential open question the full report surfaces — but cannot yet resolve — is whether the
      $12.6M diligence-adjusted EBITDA survives an independent QofE: with all addbacks Tier 4, five exceeding 5% of reported
      EBITDA individually, and several recurring across periods, the true normalized earnings base could differ materially
      from the seller''s presentation, and that gap directly sets the valuation anchor for any transaction.'
  business_snapshot_narrative: Clearsulting is a founder-led OCFO digital transformation consultancy generating TTM25 adjusted
    revenue of ~$62.9M and diligence-adjusted EBITDA of ~$12.6M (20.0% margin) across four practices — Financial Close (~$31.8M
    2025E), Treasury (~$12.2M), Digital Reporting & Compliance (~$8.6M), and Risk Advisory (~$6.4M) — billed primarily on
    T&M with a stated shift toward fixed-fee (39% of YTD May 2025 revenue per the CIM vs. 26% in 2024). The land-and-expand
    model has scaled from 223 to ~394 customers and 296 to ~587 projects over 2023–TTM25 (per CIM), with no single client
    exceeding 20% of revenue, though top-10 concentration figures are not disclosed. The 2025 launch of AMS (recurring fixed-fee,
    early clients including ExxonMobil and L'Oréal) and inaugural SAP and HighRadius partnerships represent the primary incremental
    revenue vectors, while a Poland-based delivery team provides early-stage offshore cost arbitrage. The revenue quality
    and addback profile — not the growth narrative — is what warrants the deepest scrutiny in the full report.
  confidence_rationale: Confidence is materially capped across most areas by the absence of supporting documentation for all
    12 EBITDA addbacks (Tier 4 classification across the board), which prevents independent verification of the $12.6M adjusted
    EBITDA figure that anchors valuation. The KPI agent returned no data on blended utilization, attrition by level, backlog,
    pipeline coverage, or revenue per FTE — the full set of consulting operating metrics needed to stress-test the revenue
    model — leaving business model and forecast support confidence rated low. The legal agent retrieved zero documents across
    all 11 checklist categories (contracts, employment, founder agreements, litigation, IP, insurance), meaning contract portability,
    change-of-control exposure, and key-person retention are entirely unassessed. Budget-versus-actual data was also absent
    from the data room, preventing any assessment of forecast credibility; the 2025E and 2026F projections in the CIM therefore
    rest solely on management's own presentation with no independent corroboration available in this review.
  preliminary_digest: 'Clearsulting''s OCFO consulting model has scaled to ~$62.9M TTM25 adjusted revenue with a 20% adjusted
    EBITDA margin, supported by multi-practice diversification and a land-and-expand customer base that has nearly doubled
    in project count since 2023. [Business Snapshot] Revenue growth of ~3.8% from 2024A to TTM25 is below the pace implied
    by customer and project count expansion, and episodic large-client completions (Amazon, OCI N.V.) visible in the Revenue
    Masterfile suggest average deal size or retention dynamics that the aggregate figures obscure. [Financial Strip] The $4,715K
    addback pool — 59.7% of reported TTM25 EBITDA — is entirely Tier 4 with no VDR document support, and five addbacks individually
    exceed 5% of reported EBITDA; several recur across all three periods, indicating structural rather than one-time cost
    characteristics. [Quality of Earnings] A hindsight revenue recognition restatement affects 24.6% of TTM25 revenue, multiple
    unexplained negative revenue entries appear in the Revenue Masterfile, and the company carries no allowance for doubtful
    accounts despite $157K in historical write-offs. [Revenue Quality] Core operating KPIs — blended utilization, attrition
    by level, backlog, pipeline coverage, revenue per FTE, and top-10 client concentration — are entirely absent from the
    data room, making independent validation of the operating model or forward projections impossible at this stage. [KPI
    Dashboard] The entire legal layer is unreviewed: no customer contracts, employment or founder agreements, change-of-control
    provisions, or litigation schedule were available, leaving contract portability and key-person retention unresolved. [Legal
    Snapshot] Confidence is high only on financial trends (audited/reviewed financials available); business model, KPI, legal,
    and forecast support are all rated low due to the gaps described above. [Confidence by Area]'
  thesis_bullets:
  - 'Scaled OCFO niche with multi-practice diversification: ~$62.9M TTM25 adjusted revenue across Financial Close, Treasury,
    DR&C, and Risk Advisory — no single client above 20% of revenue — positions the firm as a platform rather than a single-practice
    boutique.'
  - 'Land-and-expand model with demonstrated traction: customer count grew from 223 to ~394 and project count from 296 to
    ~587 over 2023–TTM25 per the CIM, with $300M+ in cumulative lifetime client sales cited as evidence of repeat engagement
    depth.'
  - 'Recurring revenue inflection underway: AMS (fixed-fee, Poland-delivered) and the fixed-fee/hybrid mix shift (39% of YTD
    May 2025 revenue vs. 26% in 2024) represent a structural move toward more predictable revenue that could re-rate the business
    if sustained.'
  - 'Greenfield practice optionality: SAP S/4HANA (forecast $864K in first revenue year 2026F, growing to $10.5M by 2030F
    per CIM) and HighRadius OTC partnerships provide identifiable growth vectors beyond the core T&M book, with offshore delivery
    cost arbitrage (Poland AMS team) as a margin lever.'
  - 'Deep second-layer leadership reduces key-man risk: 14 named practice leads and regional heads averaging ~7 years tenure
    provide post-close continuity, though founder agreements and equity structure remain unreviewed in the current data room.'
  - 'Inorganic capability-building precedent: the 2022 acquisitions of PBC Global (Risk Advisory) and WorkOps Consulting (Workiva/DR&C)
    demonstrate a repeatable tuck-in model for adding practice capabilities and geographic footprint, relevant to a buyer
    seeking to accelerate the platform build.'
  key_watchouts:
  - 'Talent retention at scale is unquantified: voluntary and involuntary attrition rates by level (Analyst through Partner)
    are absent from the data room — in a people-intensive consulting model where delivery quality is the product, this is
    the single most important operating metric not yet in evidence.'
  - 'Utilization rate opacity: blended billable utilization is not disclosed, making it impossible to assess whether the 20%
    EBITDA margin reflects structural efficiency or a temporarily favorable headcount-to-revenue ratio that could compress
    as the firm scales or bench costs rise.'
  - 'Episodic large-client revenue: Amazon (~$5M+ in 2022–2023, near-zero 2024–2025) and OCI N.V. show project-based revenue
    that starts and stops abruptly — the Revenue Masterfile pattern raises questions about whether the land-and-expand narrative
    holds for the largest engagements or whether top-of-funnel replenishment is masking churn at the top.'
  - 'Top-10 client concentration undisclosed: the CIM states no client exceeds 20% of revenue but does not provide top-5 or
    top-10 concentration figures — a critical gap for assessing revenue durability and change-of-control contract risk, particularly
    given that no customer MSAs or SOWs are in the VDR.'
  - 'New venture and AMS revenue replicability: four new venture practices generated losses added back in every measurement
    period ($91K / $856K / $839K across 2023–TTM25), and AMS is forecast to reach only $7.5M by 2030F — the path from early-client
    proof points (AngloAmerican, ExxonMobil) to scaled recurring revenue has not been independently validated.'
  - 'Fixed-fee model execution risk: the shift from T&M to fixed-fee/hybrid (now 39% of YTD May 2025 revenue) introduces scope-creep
    and margin-compression risk that is not yet visible in the gross margin trend — the hindsight revenue recognition restatement
    affecting 24.6% of TTM25 revenue suggests fixed-fee project accounting is already a source of complexity.'
  - 'Partner and platform dependency unreviewed: agreements with SAP, Workiva, Coupa, and HighRadius are not in the VDR —
    exclusivity, MFN, and termination provisions in these relationships are load-bearing for the new venture growth thesis
    and entirely unassessed.'
company_framing:
  overview_bullets:
  - Clearsulting is a global financial consulting and technology implementation firm specializing in Office of the CFO (OCFO)
    digital transformation, with TTM25 adjusted revenue of ~$62.9M and diligence-adjusted EBITDA of ~$12.6M (20.0% margin).
    The company earns revenue primarily through project-based consulting engagements (T&M and fixed-fee) across practices
    including Financial Close (~$31.8M 2025E, 58% gross margin), Treasury (~$12.2M, 63% gross margin), Digital Reporting &
    Compliance (~$8.6M, 48% gross margin), and Risk Advisory (~$6.4M, 40% gross margin), with overall adjusted gross margin
    of 43.6% in TTM25. The company was founded in 2015 by Marc Ursick (CEO) and is supported by a deep second layer of 14
    named practice leads and regional heads averaging ~7 years tenure; no ownership structure is disclosed in the available
    documents. The workforce of 334 FTEs (YTD Aug 2025) is primarily US-based (237) with meaningful EMEA presence (38 UK,
    30 other remote delivery) and a growing Poland-based AMS team for cost arbitrage; average compensation was $143K in TTM25.
    Customer stickiness is evidenced by growth from 223 to 394 customers and 296 to 587 projects over 2023-TTM25, a 'land
    & expand' model with no client exceeding 20% of revenue, and $300M+ in client lifetime sales. Key recent changes include
    the 2025 launch of Application Managed Services (recurring fixed-fee), an inaugural SAP partnership, APAC expansion, and
    a strategic pricing shift from T&M toward fixed-fee/hybrid models (39% of revenue YTD May 2025 vs. 26% in 2024).
  - Financial Close Practice
  - Treasury Practice
  - Digital Reporting and Compliance Practice
