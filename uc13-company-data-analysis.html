  }
  const legend = series.map((s, i) =>
    `<span><i style="background:${colors[i % 3]}"></i>${esc(s.name)}</span>`
  ).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${ticks}${bars}</svg><div class="legend">${legend}</div></div>`;
}

function table(headers, rows, rowWarn) {
  let head = "<tr>" + headers.map(h => `<th>${esc(h)}</th>`).join("") + "</tr>";
  let body = rows.map((r, i) => {
    const cls = rowWarn && rowWarn[i] ? ' class="warn"' : "";
    return `<tr${cls}>` + r.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>";
  }).join("");
  return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function stats(items) {
  return `<div class="grid grid-4">${items.map(it =>
    `<div class="stat ${it.tone || ""}"><div class="v">${esc(it.value)}</div><div class="l">${esc(it.label)}</div></div>`
  ).join("")}</div>`;
}

function callout(tone, title, body) {
  return `<div class="callout ${tone}"><div class="t">${esc(title)}</div><div>${esc(body)}</div></div>`;
}

function renderE2E() {
  const e2e = DATA.e2e;
  if (!e2e) return "";
  let html = `<hr class="hr" /><h2>E2E readiness</h2>`;
  html += `<p class="muted">Refresh ${esc(e2e.generated_at || "")} · T2 ${esc(e2e.t2_status)} / ${esc(e2e.t2_verdict)} · uc13_ale VS index: ${esc(e2e.vs_index_uc13_ale)} (uc13 index rows ${esc(e2e.vs_index_uc13_rows)})</p>`;

  const volRows = COMPANIES.map(c => {
    const v = (e2e.volumes || {})[c] || {};
    const ok = (name) => (v[name] && v[name].exists) ? "yes" : "no";
    return [
      c,
      ok("orchestrator_bundle.yaml"),
      ok("tldr_one_pager.md"),
      ok("tldr_one_pager.docx"),
      (e2e.tldr_h1 || {})[c] || "—",
      String((e2e.t2_word_counts || {})[c] || "—"),
    ];
  });
  html += `<h3>Volume artifacts + T2 word counts</h3>`;
  html += table(
    ["Company", "bundle.yaml", "tldr.md", "tldr.docx", "H1", "Words"],
    volRows
  );

  if (e2e.missing_by_workstream && e2e.missing_by_workstream.length) {
    html += `<h3 style="margin-top:16px">Missing should_parse files by workstream</h3>`;
    html += table(
      ["Company", "Workstream", "Missing files"],
      e2e.missing_by_workstream.map(r => [r.company_name, r.ws, String(r.missing_files)])
    );
  }

  if (e2e.legal_doc_count && e2e.legal_doc_count.length) {
    html += `<h3 style="margin-top:16px">LEGAL-tagged docs (classified)</h3>`;
    html += table(
      ["Company", "LEGAL docs"],
      e2e.legal_doc_count.map(r => [r.company_name, String(r.legal_docs)])
    );
  }
  return html;
}

function render(company) {
  const up = uploadOf(company);
  const ch = chunksOf(company);
  const jo = joinOf(company);
  const formats = DATA.formats[company] || {};
  const sources = DATA.source_types[company] || {};
  const fileTypes = DATA.file_types[company] || {};
  const conf = DATA.confidence[company] || {};
  const workstreams = DATA.workstreams[company] || [];
  const embWs = DATA.emb_ws_text[company] || [];
  const profile = DATA.profiles.find(r => r.company_name === company);
  const agents = DATA.agents[company];
  const page = DATA.page.find(r => r.company_name === company);
  const embTier = DATA.emb_tier.filter(r => r.company_name === company);
  const prov = DATA.provenance.find(r => r.company_name === company);
  const provSrc = DATA.prov_source.filter(r => r.company_name === company);
  const harness = DATA.harness.filter(r => r.company_name === company);

  const corpusChart = {
    categories: DATA.upload.map(r => r.company.replace("Elder Care", "Elder")),
    series: [{ name: "MB uploaded", data: DATA.upload.map(r => r.mb) }]
  };
  const chunkChart = {
    categories: DATA.chunks.map(r => r.company.replace("Elder Care", "Elder")),
    series: [{ name: "Words (M)", data: DATA.chunks.map(r => +(r.words / 1e6).toFixed(2)) }]
  };
  const tokenChart = {
    categories: DATA.chunks.map(r => r.company.replace("Elder Care", "Elder")),
    series: [{ name: "Tokens M", data: DATA.chunks.map(r => +(r.tokens4 / 1e6).toFixed(2)) }]
  };
  const ingestChart = {
    categories: DATA.join.map(r => r.company.replace("Elder Care", "Elder")),
    series: [{ name: "% ingested", data: DATA.join.map(r => r.pct) }]
  };

  const overviewRows = COMPANIES.map(c => {
    const u = uploadOf(c);
    const k = chunksOf(c);
    const j = joinOf(c);
    const pr = DATA.profiles.find(r => r.company_name === c);
    return [
      c,
      String(u.files),
      String(u.mb),
      k ? String(k.chunks) : "0",
      k ? fmt(k.words) : "—",
      k ? fmt(k.tokens4) : "—",
      String(j.pct) + "%",
      pr ? String(pr.overlay_confidence) : "missing",
    ];
  });

  let html = "";
  html += `<h1>UC-13 company data analysis</h1>`;
  html += `<p class="sub">Live warehouse probe of uc13_ale — uploads, classification, chunk/embedding text volume, agent richness, and Elder Care retrieval intents (baseline_1aeb0ace584a). E2E readiness refresh 2026-07-17 — T2 all-4 PASS; uc13_ale VS index missing.</p>`;
  html += stats([
    { value: "4", label: "Companies in SharePoint" },
    { value: "4", label: "Fully chunked", tone: "success" },
    { value: "0", label: "VS index (uc13_ale)", tone: "danger" },
    { value: "49", label: "Baseline intents (Elder Care)" },
  ]);
  html += callout("danger", "uc13_ale vector index missing",
    "Delta has ~109k embeddings across 4 companies but uc13_ale.ingestion.embeddings_index does not exist. GKF and SPG pipeline harness runs show fallback_rate=1.0 and provenance avg_sim=0. Run setup_vector_search / Cell 2b for catalog=uc13_ale before trusting semantic retrieval on new companies.");
  html += callout("success", "Wed T2 baseline — all 4 PASS",
    "All companies have orchestrator bundle + tldr_one_pager.md/.docx titled Executive Summary on uc13_ale (see .dev/t2_baseline_run_log.json). SPG: 71,010 chunks/embeddings, agents rendered Jul 17 salvage run.");

  html += `<h2>Cross-company corpus</h2>`;
  html += `<div class="grid grid-2">
    <div class="panel stack"><h3>Uploaded size (MB) by company</h3>${barChart(corpusChart.categories, corpusChart.series, 220)}<div class="small">Source: uc13_ale.ingestion.upload_log · sum(size_bytes)</div></div>
    <div class="panel stack"><h3>Ingested text volume (M words)</h3>${barChart(chunkChart.categories, chunkChart.series, 220)}<div class="small">Source: chunks · whitespace token count on chunk_text</div></div>
  </div>`;
  html += `<div class="grid grid-2" style="margin-top:12px">
    <div class="panel stack"><h3>Approx tokens (chars/4, millions)</h3>${barChart(tokenChart.categories, tokenChart.series, 200)}</div>
    <div class="panel stack"><h3>should_parse → chunks ingest %</h3>${barChart(ingestChart.categories, ingestChart.series, 200)}<div class="small">Elder Care only 52.0% of should_parse files present in chunks</div></div>
  </div>`;
  html += `<div style="margin-top:14px">${table(
    ["Company", "Files", "MB", "Chunks", "Words", "≈Tokens", "Ingest %", "Profile"],
    overviewRows,
    COMPANIES.map(c => c === "SPG" || (joinOf(c) && joinOf(c).pct < 90))
  )}</div>`;

  html += renderE2E();

  html += `<hr class="hr" />`;
  html += `<div class="row"><h2 style="margin:0">Company drill-down</h2>
    <select id="companySelect">${COMPANIES.map(c =>
      `<option value="${esc(c)}"${c === company ? " selected" : ""}>${esc(c)}</option>`
    ).join("")}</select></div>`;

  const ingestTone = jo && jo.pct >= 90 ? "success" : jo && jo.pct > 0 ? "warning" : "danger";
  html += `<div style="margin-top:14px">${stats([
    { value: up ? String(up.files) : "0", label: "Uploaded files" },
    { value: up ? String(up.mb) + " MB" : "—", label: "Corpus size" },
    { value: ch ? String(ch.chunks) : "0", label: "Chunks", tone: ch ? "success" : "warning" },
    { value: jo ? String(jo.pct) + "%" : "—", label: "should_parse ingested", tone: ingestTone },
  ])}</div>`;

  if (ch) {
    html += `<div style="margin-top:12px">${stats([
      { value: fmt(ch.chars), label: "Total chars" },
      { value: fmt(ch.words), label: "Total words" },
      { value: fmt(ch.tokens4), label: "Approx tokens (chars/4)" },
      { value: String(ch.avg_chars), label: `Avg chars/chunk (p50 ${ch.p50})` },
    ])}</div>`;
  } else {
    html += callout("warning", "No chunk corpus yet",
      `Classification exists for ${company}, but ingestion_parser has not written chunks/embeddings.`);
  }

  if (profile) {
    html += `<div class="card"><div class="card-h"><span>Company profile</span><span class="pill">${esc(profile.overlay_confidence)} conf</span></div>
      <div class="card-b">Overlay ${esc(profile.industry_overlay)} · deal ${esc(profile.deal_type)} · banked ${esc(profile.banked)} · profiler gaps ${esc(profile.n_gaps)} · description ${esc(profile.desc_chars)} chars</div></div>`;
  }

  const formatRows = Object.entries(formats).map(([k, v]) => [k, String(v)]);
  const confKeys = ["high", "medium", "low"].filter(k => conf[k] != null);
  html += `<div class="grid grid-2" style="margin-top:12px">
    <div class="panel stack"><h3>Upload formats</h3>${table(["Format", "Files"], formatRows)}</div>
    <div class="panel stack"><h3>Classifier confidence</h3>${
      confKeys.length
        ? barChart(confKeys, [{ name: "Docs", data: confKeys.map(k => conf[k] || 0) }], 180)
        : `<div class="muted">No classification rows</div>`
    }</div>
  </div>`;

  html += `<h3 style="margin-top:18px">Workstream classification (exploded)</h3>`;
  if (workstreams.length) {
    const cats = workstreams.map(r => r.ws.replace("QUALITY_EARNINGS", "QoE").replace("BUSINESS_MODEL", "BM"));
    html += barChart(cats, [
      { name: "Docs tagged", data: workstreams.map(r => r.docs) },
      { name: "should_parse", data: workstreams.map(r => r.should_parse) },
    ], 220);
    html += `<div style="margin-top:10px">${table(
      ["Workstream", "Docs", "Should parse", "High", "Med", "Low", "Avg tier"],
      workstreams.map(r => [r.ws, String(r.docs), String(r.should_parse), String(r.high), String(r.med), String(r.low), String(r.avg_tier)])
    )}</div>`;
  }

  if (company === "Clearsulting") {
    html += callout("danger", "Clearsulting has zero LEGAL-tagged docs",
      "Explains empty legal registers and historical 0/11 legal checklist — pipeline can be green while diligence surface is absent.");
  }
  if (company === "GKF") {
    html += callout("warning", "GKF retrieval provenance avg_sim = 0",
      "Recent pipeline harness runs show fallback_rate=1.0 — semantic path not scoring; keyword/fallback context only. Agents still wrote rows Jul 17.");
  }
  if (company === "SPG") {
    html += callout("warning", "SPG retrieval on keyword fallback",
      "Largest corpus (71k chunks) but pipeline harness fallback_rate=1.0 and provenance avg_sim=0 — same root cause as GKF: missing uc13_ale.ingestion.embeddings_index. Agents + exec summary rendered Jul 17.");
  }

  if (Object.keys(sources).length) {
    const sk = Object.keys(sources);
    html += `<h3 style="margin-top:18px">Chunk source_type mix</h3>`;
    html += barChart(sk, [
      { name: "Chunks", data: sk.map(k => sources[k].chunks) },
      { name: "Words (k)", data: sk.map(k => +(sources[k].words / 1000).toFixed(1)) },
    ], 220);
    html += `<div style="margin-top:10px">${table(
      ["Source", "Chunks", "Chars", "Words"],
      sk.map(k => [k, String(sources[k].chunks), fmt(sources[k].chars), fmt(sources[k].words)])
    )}</div>`;
  }

  const ftEntries = Object.entries(fileTypes);
  if (ftEntries.length) {
    html += `<h3 style="margin-top:18px">Chunk file_type mix</h3>`;
    html += table(
      ["File type", "Chunks", "Files", "Chars"],
      ftEntries.map(([k, v]) => [k, String(v.chunks), String(v.files), fmt(v.chars)])
    );
  }

  if (embWs.length) {
    html += `<h3 style="margin-top:18px">Embedded text by workstream (joined chunks×embeddings)</h3>`;
    html += barChart(
      embWs.map(r => r.ws.replace("QUALITY_EARNINGS", "QoE").replace("BUSINESS_MODEL", "BM")),
      [{ name: "Chars (M)", data: embWs.map(r => +(r.chars / 1e6).toFixed(2)) }],
      220
    );
    html += `<div style="margin-top:10px">${table(
      ["Workstream", "Embeddings", "Chars", "Words", "Avg chars"],
      embWs.map(r => [r.ws, String(r.embeddings), fmt(r.chars), fmt(r.words), String(r.avg_chars)])
    )}</div>`;
  }

  if (embTier.length) {
    html += `<h3 style="margin-top:18px">Embedding priority tiers</h3>`;
    html += table(
      ["Tier", "Embeddings", "Files"],
      embTier.map(r => [String(r.priority_tier), String(r.embeddings), String(r.files)])
    );
  }

  if (page) {
    html += `<p class="muted" style="margin-top:12px">Page metadata: ${esc(page.with_page)}/${esc(page.chunks)} chunks have pages (max page ${esc(page.max_page)}); ${esc(page.distinct_sections)} distinct section headers.</p>`;
  }

  html += `<hr class="hr" /><h2>Agent output richness — ${esc(company)}</h2>`;
  if (agents) {
    html += table(
      ["Agent", "Gaps", "Exec chars", "Citation chars", "Detail"],
      Object.entries(agents).map(([name, a]) => [
        name,
        String(a.gaps),
        String(a.exec || "—"),
        String(a.citations),
        Object.entries(a.extra || {}).map(([k, v]) => k + "=" + String(v)).join("; ") || "—",
      ])
    );
  } else {
    html += `<p class="muted">No analysis rows for this company yet.</p>`;
  }

  html += `<hr class="hr" /><h2>Retrieval intents & provenance</h2>`;
  const evalDist = Object.entries(DATA.eval_status_dist || {}).map(([k, v]) => k + ":" + v).join(", ");
  html += `<p class="muted">Gold-label intent scoring exists only for Elder Care baseline (${esc(evalDist)}). Other companies have pipeline provenance only.</p>`;

  if (harness.length) {
    html += table(
      ["Run type", "Status", "Runs", "Last run", "Avg intents", "Fallback", "Empty"],
      harness.map(r => [
        String(r.run_type),
        String(r.harness_status),
        String(r.runs),
        String(r.last_run).slice(0, 10),
        Number(r.avg_intents).toFixed(1),
        Number(r.avg_fallback).toFixed(2),
        Number(r.avg_empty).toFixed(3),
      ])
    );
  }

  if (prov) {
    html += `<div style="margin-top:12px">${stats([
      { value: String(prov.runs), label: "Provenance runs" },
      { value: String(prov.distinct_intents_in_provenance), label: "Distinct intents seen" },
      { value: String(prov.provenance_rows), label: "Provenance rows" },
      { value: String(prov.avg_sim), label: "Avg sim score" },
    ])}</div>`;
  }

  if (provSrc.length) {
    html += `<div style="margin-top:12px">${table(
      ["Source type", "Hits", "Avg sim", "Avg chars alloc"],
      provSrc.map(r => [
        String(r.source_type),
        String(r.hits),
        String(r.avg_sim),
        r.avg_chars == null ? "—" : String(r.avg_chars),
      ])
    )}</div>`;
  }

  if (company === "Elder Care") {
    html += `<h3 style="margin-top:18px">Baseline intent rollup by agent</h3>`;
    html += table(
      ["Agent", "Intents", "Avg recall@10", "Avg MRR", "Avg results", "Empty"],
      (DATA.intent_rollup || []).map(r => [
        r.agent,
        String(r.intents),
        r.avg_recall == null ? "—" : String(r.avg_recall),
        r.avg_mrr == null ? "—" : String(r.avg_mrr),
        String(r.avg_results),
        String(r.empty_n),
      ])
    );
    html += `<h3 style="margin-top:18px">All 49 baseline intents</h3>`;
    html += table(
      ["Agent", "Intent", "Status", "Recall@10", "MRR", "Results", "Mode"],
      (DATA.intents || []).map(r => [
        r.agent,
        r.intent,
        r.status,
        r.recall == null ? "—" : String(r.recall),
        r.mrr == null ? "—" : String(r.mrr),
        String(r.n),
        r.mode || "—",
      ])
    );
  }

  html += `<p class="small" style="margin-top:28px">Catalog uc13_ale · tokens ≈ char_count/4 · words = whitespace split on chunk_text · companions: uc13-company-data-analysis.md / .canvas.tsx · E2E refresh 2026-07-17</p>`;
  return html;
}

function mount(company) {
  const app = document.getElementById("app");
  app.innerHTML = render(company);
  const sel = document.getElementById("companySelect");
  if (sel) sel.addEventListener("change", e => mount(e.target.value));
}

mount("Elder Care");
</script>
</body>
</html>
